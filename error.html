<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ status_code }} | Myer's College Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #800000;
            --primary-light: #b22929;
            --bg: #120607;
            --card-bg: #1f0d0f;
            --text: #f6dede;
            --border: rgba(255, 203, 203, 0.18);
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.25rem;
            font-family: 'Outfit', sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 20% 20%, rgba(178, 41, 41, 0.35), transparent 30%),
                linear-gradient(150deg, #1a0709 0%, var(--bg) 100%);
        }

        .panel {
            width: 100%;
            max-width: 560px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2.2rem;
            text-align: center;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.35);
        }

        .code {
            margin: 0;
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary-light);
            line-height: 1;
        }

        h1 {
            margin: 0.7rem 0 0.4rem;
            font-family: 'Playfair Display', serif;
            font-size: 1.9rem;
            color: #fff;
        }

        p {
            margin: 0 0 1.4rem;
            opacity: 0.9;
        }

        .btn {
            display: inline-block;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            background: var(--primary);
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--primary-light);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <main class="panel">
        <p class="code">{{ status_code }}</p>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        <a class="btn" href="/">Back to Dashboard</a>
    </main>
</body>
</html>
